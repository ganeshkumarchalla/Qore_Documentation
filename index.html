<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QORE Documentation</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#08111b;color:#eef7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#244462,transparent 38%),#08111b}.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.side{padding:24px 16px;border-right:1px solid #29445d;background:#0b1624ee}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;color:#a9dcff;letter-spacing:.13em;font-weight:800}.side input{width:100%;padding:10px;border:1px solid #41617c;border-radius:8px;background:#07111d;color:#eef7ff}.group{margin:22px 8px 6px;color:#78a8cc;font-size:10px;font-weight:800;letter-spacing:.15em}.nav button{display:block;width:100%;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:#afc4d8;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:#285476aa;color:#fff}.content{width:min(900px,calc(100% - 54px));margin:auto;padding:30px 0 80px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #29445d;padding-bottom:16px;color:#91b4cf;font-size:13px}.eyebrow{font-size:11px;color:#82bce8;font-weight:800;letter-spacing:.15em}h1{font-size:clamp(2.5rem,6vw,5rem);line-height:1;margin:18px 0}h2{font-size:clamp(2rem,4vw,3rem);margin:14px 0}p,li{color:#c5d7e6;line-height:1.8}.card,.callout{padding:20px;border:1px solid #294a66;border-radius:14px;background:#14283dcc;margin:22px 0}.callout{border-left:3px solid #82bce8;background:#102b42}.api{display:grid;grid-template-columns:150px 1fr;gap:1px;background:#294a66;margin:22px 0;border:1px solid #294a66;border-radius:12px;overflow:hidden}.api div{padding:12px;background:#102033}.api div:nth-child(odd){color:#8ed0fb;font-family:ui-monospace,monospace}.page{animation:rise .28s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:48px}.actions button,.brand button{padding:9px 12px;border:1px solid #41617c;border-radius:8px;background:#17324a;color:#dff2ff;cursor:pointer}.closed .app{grid-template-columns:58px minmax(0,1fr)}.closed .side{padding:24px 8px}.closed .side nav,.closed .side input{display:none}.closed .brand span{display:none}@media(max-width:780px){.app{display:block}.side{border-right:0;border-bottom:1px solid #29445d}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.group{grid-column:1/-1}.content{width:calc(100% - 34px);padding-top:24px}.api{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand"><span>QORE / DOCS</span><button id="toggle">☰</button></div><input id="search" placeholder="Search documentation"><nav id="nav" class="nav"></nav></aside><main class="content"><header class="top"><span id="crumb">QORE / Welcome</span><span>v1.0 · Local-first</span></header><article id="page" class="page"></article><div class="actions"><button id="prev">← Previous</button><button id="next">Next →</button></div></main></div><script>
const docs=[
['Welcome','START HERE','Quantum computing, made tangible.','QORE is a visual, editable quantum workbench for learning concepts, writing Qiskit circuits, running local simulations, and understanding evidence. Start with foundations, then use Quantum Lab to turn source code into explainable output.','Use the sidebar to move between conceptual guides, QORE workflows, and reference pages. Every section has a shareable hash URL.'],
['QORE workflow','START HERE','Edit, run, inspect, preserve.','A reliable quantum workflow begins with an editable circuit and ends with evidence. QORE keeps source, simulation settings, visual outputs, terminal diagnostics, and run history in one workspace.','Create a project, write a Qiskit circuit, choose shots and a seed, run Aer, compare output to the ideal model, then export the evidence.'],
['Qubits & states','FOUNDATIONS','Qubits are probability amplitudes.','A qubit is described by complex amplitudes α and β, where |α|² + |β|² = 1. Measurement samples 0 or 1 according to these probabilities. Superposition is not a vague blend; it is a mathematical state that can interfere.','The Bloch sphere maps a pure one-qubit state to a vector. Use it to connect gate operations with state direction, phase, and measurement probability.'],
['Circuits & gates','FOUNDATIONS','Circuits compose quantum transformations.','Quantum gates are ordered reversible operations. H creates balanced superposition, X flips computational basis states, Z changes phase, and CX applies a conditional operation between qubits.','QORE supports standard Qiskit circuit construction and Aer simulation. Change one gate at a time and compare distributions to learn cause and effect.'],
['Measurement','FOUNDATIONS','Finite shots create distributions.','One shot returns a bitstring. Repeating the circuit produces counts that estimate the underlying ideal distribution. Statistical variation is expected at finite shot counts.','Total variation distance compares sampled results with ideal reference probabilities. Use more shots for tighter estimates and a fixed seed for reproducibility.'],
['Entanglement','FOUNDATIONS','Joint states can exceed classical descriptions.','Entanglement occurs when a multi-qubit state cannot be expressed as independent single-qubit states. Interference changes which joint outcomes are likely.','Compare a register distribution with individual Bloch views: local information does not always reveal the complete joint state.'],
['Quantum Lab','QORE BUILD','Execute Qiskit circuits locally.','Quantum Lab connects editable Python source to Qiskit Aer. Configure shots, seed, optimization, and optional noise, then inspect counts, probabilities, amplitudes, unitaries, QASM, and warnings.','The execution metadata records backend, duration, timestamp, TVD, and parameters so an experiment can be repeated.'],
['State World & Bloch','QORE BUILD','Visualize quantum state behavior.','State World presents basis states in an interactive orbital scene. Bloch views show focused or all-qubit state vectors, axes, purity, polar angle, and phase.','Use visual output as a second representation of the same circuit, not as a substitute for measurement statistics.'],
['Quantum Ledger','QORE BUILD','Keep every run explainable.','The Ledger stores source fingerprints, backend, shots, seed, noise settings, execution time, warnings, framework versions, and historical snapshots.','When troubleshooting, capture the circuit, file path, terminal output, and metadata before changing the program.'],
['Qiskit & Aer','REFERENCE','The local quantum SDK stack.','Qiskit is the Python SDK for quantum circuits, operators, transpilation, and primitives. Aer supplies high-performance local simulation for statevectors, noise models, and shot-based sampling.','QORE also installs the IBM Quantum Runtime client and supported research add-ons. Cloud hardware requires separate secure backend-only credentials.'],
['Applications','APPLICATIONS','Where to explore quantum advantage.','Optimization, chemistry and materials simulation, cryptography, and hybrid machine learning are active research areas. Quantum value depends on the problem, algorithm, hardware, and error profile.','Use QORE to prototype and explain circuits before making performance or hardware claims.'],
['Deployment & support','OPERATIONS','Operate responsibly.','Public execution should be isolated, authenticated, rate limited, and bounded by qubit, shot, memory, and time limits. Never expose cloud tokens in a frontend.','For help, collect the source, backend, seed, shots, error message, terminal output, and execution metadata.']];
const nav=document.getElementById('nav'),page=document.getElementById('page'),crumb=document.getElementById('crumb'),search=document.getElementById('search');let current=0;function render(i){current=(i+docs.length)%docs.length;const d=docs[current];crumb.textContent='QORE / '+d[0];page.innerHTML=`<span class="eyebrow">${d[1]}</span><h1>${d[2]}</h1><p>${d[3]}</p><div class="callout">${d[4]}</div><h2>Reference</h2><div class="api"><div>Scope</div><div>${d[1]}</div><div>QORE support</div><div>Local-first documentation and validated simulator workflow</div><div>Next step</div><div>Use the adjacent topic or open the relevant QORE workspace view.</div></div>`;location.hash=d[0].toLowerCase().replaceAll(' ','-').replaceAll('&','and');[...nav.children].forEach((x,n)=>x.classList.toggle('active',n===current))}let last='';docs.forEach((d,i)=>{if(d[1]!==last){last=d[1];const g=document.createElement('div');g.className='group';g.textContent=last;nav.append(g)}const b=document.createElement('button');b.textContent=d[0];b.onclick=()=>render(i);nav.append(b)});search.oninput=()=>{const q=search.value.toLowerCase();[...nav.querySelectorAll('button')].forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))};document.getElementById('prev').onclick=()=>render(current-1);document.getElementById('next').onclick=()=>render(current+1);document.getElementById('toggle').onclick=()=>document.body.classList.toggle('closed');const found=docs.findIndex(d=>d[0].toLowerCase().replaceAll(' ','-').replaceAll('&','and')===location.hash.slice(1));render(found<0?0:found);
</script></body></html>
